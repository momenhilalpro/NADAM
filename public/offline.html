<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#131921">
    <title>أنت غير متصل - متجر الندم</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Tahoma, Arial, sans-serif;
            color: #131921;
            background: #f4f5f7;
        }
        main {
            width: min(520px, 100%);
            text-align: center;
            padding: 36px 24px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 36px rgba(19, 25, 33, 0.12);
        }
        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            background: #cc0c39;
            font-size: 34px;
        }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { margin: 0 0 24px; line-height: 1.8; color: #565959; }
        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 22px;
            cursor: pointer;
            color: #111;
            background: #febd69;
            font: inherit;
            font-weight: 700;
        }
        button:focus-visible { outline: 3px solid #007185; outline-offset: 3px; }
    </style>
</head>
<body>
    <main role="main">
        <div class="icon" aria-hidden="true">!</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تعذر تحميل هذه الصفحة حالياً. تحقق من اتصال الشبكة، ثم حاول مرة أخرى.</p>
        <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    </main>
</body>
</html>
